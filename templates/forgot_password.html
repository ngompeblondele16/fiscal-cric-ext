<!DOCTYPE html>
<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mot de passe oublié - TaxStats AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#00288e",
                    "primary-container": "#1e40af",
                    "on-primary": "#ffffff",
                    "on-surface": "#191c1e",
                    "on-surface-variant": "#444653",
                    "outline-variant": "#c4c5d5"
            }
          }
        }
      }
</script>
<style>
        body { background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="flex justify-center mb-4">
      <div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[28px]">mail</span>
      </div>
    </div>
    <h1 class="text-2xl font-bold text-on-surface">Mot de passe oublié</h1>
    <p class="text-sm text-on-surface-variant mt-2">Saisissez l'adresse email enregistrée pour recevoir un code à 6 chiffres.</p>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="bg-blue-50 border border-blue-200 text-blue-900 text-sm rounded-lg px-4 py-3">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="bg-white rounded-2xl shadow-lg p-5 sm:p-8">
    <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-6">
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wide mb-2">Email administrateur</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant text-[20px]">alternate_email</span>
          <input type="email" name="email" required autocomplete="email"
            placeholder="admin@votre-domaine.com"
            class="w-full pl-10 pr-4 py-2.5 border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container"/>
        </div>
      </div>
      <button type="submit" class="w-full bg-primary-container text-on-primary font-bold py-2.5 rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
        Envoyer le code
        <span class="material-symbols-outlined text-[20px]">send</span>
      </button>
    </form>
    <div class="text-center mt-6">
      <a href="{{ url_for('login') }}" class="text-sm text-primary-container font-semibold hover:underline">← Retour à la connexion</a>
    </div>
  </div>
</div>
</body></html>

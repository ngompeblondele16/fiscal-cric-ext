<!DOCTYPE html>
<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nouveau mot de passe - TaxStats AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#1e40af",
                    "on-primary": "#ffffff",
                    "on-surface": "#191c1e",
                    "on-surface-variant": "#444653",
                    "outline-variant": "#c4c5d5"
            }
          }
        }
      }
</script>
<style>
        body { background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="flex justify-center mb-4">
      <div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[28px]">pin</span>
      </div>
    </div>
    <h1 class="text-2xl font-bold text-on-surface">Nouveau mot de passe</h1>
    <p class="text-sm text-on-surface-variant mt-2">Code envoyé à <strong>{{ reset_email }}</strong></p>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="bg-red-50 border border-red-200 text-red-900 text-sm rounded-lg px-4 py-3">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="bg-white rounded-2xl shadow-lg p-5 sm:p-8">
    <form method="POST" action="{{ url_for('reset_password') }}" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wide mb-2">Code à 6 chiffres</label>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"
          placeholder="000000"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-lg text-center text-2xl tracking-[0.4em] font-bold focus:outline-none focus:ring-2 focus:ring-primary-container"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wide mb-2">Nouveau mot de passe</label>
        <input type="password" name="password" minlength="8" required autocomplete="new-password"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container"/>
        <p class="text-xs text-on-surface-variant mt-1">Minimum 8 caractères</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wide mb-2">Confirmer</label>
        <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container"/>
      </div>
      <button type="submit" class="w-full bg-primary-container text-on-primary font-bold py-2.5 rounded-lg hover:opacity-90">
        Enregistrer le mot de passe
      </button>
    </form>
    <div class="text-center mt-6 space-y-2">
      <a href="{{ url_for('forgot_password') }}" class="block text-sm text-primary-container font-semibold hover:underline">Renvoyer un code</a>
      <a href="{{ url_for('login') }}" class="block text-sm text-on-surface-variant hover:underline">Retour à la connexion</a>
    </div>
  </div>
</div>
</body></html>
